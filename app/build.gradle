plugins { id 'com.android.application' }

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.cricket.scoreboard'
    compileSdk 34
    defaultConfig {
        applicationId 'com.xdduncan.dartsscoreboard'
        minSdk 22
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'darts'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
