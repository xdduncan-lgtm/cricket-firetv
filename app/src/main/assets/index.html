<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Scoreboard TV</title>
<style>
:root{--bg:#141C19;--surface:#1E2A26;--raised:#26352F;--ink:#EEECE4;--muted:#93A19B;--line:#33433D;
  --p0:#E35D50;--p1:#52B97F;--p2:#6C9BE6;--p3:#B48AE0;--gold:#F0C04E;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:calc(100vw / 60);height:100%;overflow:hidden}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif;overflow:hidden;cursor:none}
.slab{font-family:Rockwell,"Roboto Slab","Zilla Slab",Georgia,serif;font-weight:800}
.fl{height:1em;width:auto;vertical-align:-.12em}
#app{height:100%;padding:1.2rem 1.5rem}
.sel{outline:.22rem solid var(--gold);outline-offset:.12rem}

/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:1.3rem;height:100%}
.board{background:var(--surface);border-radius:.5rem;overflow:hidden;display:grid;grid-template-rows:5.4rem repeat(7,1fr)}
.row{display:grid;grid-template-columns:7rem repeat(var(--n),minmax(0,1fr));align-items:stretch;border-top:.06rem solid var(--line)}
.row:first-child{border-top:0}
.row>div{display:flex;align-items:center;justify-content:center;min-width:0}
.head .ph{flex-direction:column;gap:.1rem;padding:.3rem;opacity:.55}
.head .ph.on{opacity:1}
.ph .nm{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ph .nm .fl{font-size:1.1rem;margin-right:.3rem}
.ph .sc{font-size:2rem;line-height:1}
.ph .mpr{font-size:.65rem;color:var(--muted)}
.num{font-size:2rem}
.row.cur{background:var(--raised)}
.row.cur .num{background:var(--gold);color:#141C19}
.col.on{background:rgba(255,255,255,.04)}
.cell svg{height:2.3rem;width:2.3rem}
.c0{color:var(--p0)}.c1{color:var(--p1)}.c2{color:var(--p2)}.c3{color:var(--p3)}
.row.dead .num{text-decoration:line-through;color:var(--muted)}
.row.dead .cell{opacity:.4}
.side{display:flex;flex-direction:column;gap:.8rem}
.who{background:var(--surface);border-radius:.5rem;padding:.8rem 1rem;border-left:.4rem solid var(--pc)}
.who .n{font-size:1.4rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .n .fl{font-size:1.9rem;margin-right:.4rem}
.who .r{color:var(--muted);font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.slot{border:.12rem dashed var(--line);border-radius:.35rem;text-align:center;padding:.35rem 0;font-weight:700;font-size:1.05rem;color:var(--muted)}
.slot.f{border-style:solid;border-color:var(--ink);color:var(--ink)}
.mult{display:grid;grid-template-columns:repeat(3,1fr);border:.12rem solid var(--ink);border-radius:.4rem;overflow:hidden}
.mult div{text-align:center;padding:.55rem 0;font-weight:700;font-size:1rem}
.mult div+div{border-left:.12rem solid var(--ink)}
.mult .on{background:var(--ink);color:var(--bg)}
.mult .off{opacity:.3}
.acts{display:flex;flex-direction:column;gap:.45rem}
.act{background:var(--surface);border-radius:.4rem;padding:.55rem 1rem;font-weight:700;font-size:1rem;display:flex;justify-content:space-between}
.act .k{color:var(--muted);font-weight:400}
.act.cur{background:var(--gold);color:#141C19}.act.cur .k{color:#141C19}
.help{margin-top:auto;color:var(--muted);font-size:.78rem;line-height:1.5}
.last{color:var(--muted);font-size:.8rem;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* setup */
.setup{display:flex;flex-direction:column;height:100%;gap:1rem}
.setup h1{font-size:3rem;margin:0;line-height:1}
.setup .sub{color:var(--muted);margin:-.4rem 0 0;font-size:1rem}
.count{display:flex;align-items:center;gap:1rem;font-size:1.2rem;align-self:flex-start;padding:.5rem 1rem;border-radius:.4rem;background:var(--surface)}
.count b{font-size:1.8rem;min-width:1.5rem;text-align:center}
.count .ar{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;flex:1;min-height:0}
.card{background:var(--surface);border-radius:.5rem;border-top:.4rem solid var(--pc);padding:1rem;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.card .fbox{border-radius:.4rem;padding:.6rem;text-align:center;background:var(--raised)}
.card .fbox .fl{font-size:4.5rem}
.card .fbox div{font-size:.85rem;color:var(--muted);margin-top:.2rem}
.card .name{border-radius:.4rem;padding:.6rem;background:var(--raised);font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .name small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.start{align-self:flex-start;background:var(--ink);color:var(--bg);font-weight:800;font-size:1.3rem;padding:.7rem 2.4rem;border-radius:.4rem}
.hint{color:var(--muted);font-size:.85rem}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.box{background:var(--surface);border-radius:.6rem;padding:1.6rem 2rem;min-width:22rem;text-align:center;border-top:.5rem solid var(--pc,var(--gold))}
.box h2{font-size:2.4rem;margin:.3rem 0;color:var(--pc,var(--ink))}
.box p{color:var(--muted);margin:0 0 1.2rem;font-size:1rem}
.box .bigf .fl{font-size:5rem}
.opt{padding:.65rem 1.2rem;border-radius:.4rem;background:var(--raised);font-weight:700;font-size:1.1rem;margin-top:.5rem}
.opt.cur{background:var(--gold);color:#141C19}
.grid{display:grid;grid-template-columns:repeat(9,5.6rem);gap:.4rem}
.gi{padding:.4rem .2rem;border-radius:.35rem;text-align:center;font-size:.62rem;color:var(--muted);background:var(--raised)}
.gi .fl{font-size:2.2rem;display:block;margin:0 auto .2rem}
.gi.cur{background:var(--gold);color:#141C19}
</style>
</head>

const flag=k=>{const f=FLAGS.find(x=>x[0]===k)||FLAGS[0];return `<img class="fl" src="${FIMG[f[0]]}" alt="${f[1]} flag">`;};
const fname=k=>(FLAGS.find(x=>x[0]===k)||FLAGS[0])[1];
const KEY='cricket-tv-v1';
let setup=[{name:'Player 1',flag:'ENG'},{name:'Player 2',flag:'NL'},{name:'Player 3',flag:'SCO'},{name:'Player 4',flag:'US'}],count=2,S=null;
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){if(d.setup)setup=d.setup;if(d.count)count=d.count;if(d.S)S=d.S;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({setup,count,S}))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>Object.fromEntries(NUMS.map(n=>[n,0]));
const app=document.getElementById('app');
const ui={cur:0,menu:null,pick:null,srow:3,scol:0,win:0};
const ACTS=[['Miss','⏯'],['Undo','⏪'],['Next player','⏩'],['Menu','☰']];
const N=()=>S.players.length;

/* ---- game engine ---- */
function newGame(starter){
  S={players:setup.slice(0,count).map(p=>({name:p.name.trim()||'Player',flag:p.flag,marks:blank(),score:0,mt:0,turns:0})),
     turn:starter,starter,dart:0,round:1,mult:1,darts:[],last:null,hist:[],winner:null};
  ui.cur=0;ui.menu=null;ui.win=0;persist();render();
}
function snap(){const c={...S};delete c.hist;S.hist.push(JSON.stringify(c));if(S.hist.length>300)S.hist.shift();}
function undo(){if(!S.hist.length)return;const h=S.hist;S=JSON.parse(h.pop());S.hist=h;persist();render();}
function advance(){S.players[S.turn].turns++;S.last={who:S.turn,darts:S.darts.slice()};S.turn=(S.turn+1)%N();S.dart=0;S.darts=[];S.mult=1;if(S.turn===S.starter)S.round++;}
function hit(num){
  if(S.winner!==null||S.dart>=3)return;
  snap();
  let m=S.mult;if(num===25&&m===3)m=2;
  let label='Miss';
  if(num){
    const p=S.players[S.turn],others=S.players.filter((_,i)=>i!==S.turn);
    const add=Math.min(m,3-p.marks[num]),extra=m-add;
    p.marks[num]+=add;let sm=0;
    if(extra>0&&others.some(o=>o.marks[num]<3)){p.score+=extra*num;sm=extra;}
    p.mt+=add+sm;
    label=num===25?(m===2?'Bull':'25'):(['S','D','T'][m-1]+num);
    if(NUMS.every(n=>p.marks[n]>=3)&&others.every(o=>p.score>=o.score)){S.darts.push(label);S.dart++;p.turns++;S.winner=S.turn;ui.win=0;persist();render();return;}
  }
  S.darts.push(label);S.dart++;S.mult=1;
  if(S.dart>=3)advance();
  persist();render();
}
function nextPlayer(){if(S.winner!==null)return;snap();advance();persist();render();}
function mpr(i){const p=S.players[i];const t=p.turns+(S.turn===i&&S.dart>0&&S.winner===null?1:0);return t?(p.mt/t).toFixed(2):'0.00';}

/* ---- remote handling ---- */
function handle(k){
  if(ui.pick)return keyPick(k);
  if(ui.menu)return keyMenu(k);
  if(!S)return keySetup(k);
  if(S.winner!==null)return keyWin(k);
  return keyGame(k);
}
function keyGame(k){
  const onNum=ui.cur<=6;
  switch(k){
    case 'up':ui.cur=Math.max(0,ui.cur-1);break;
    case 'down':ui.cur=Math.min(10,ui.cur+1);break;
    case 'left':if(onNum)S.mult=Math.max(1,S.mult-1);break;
    case 'right':if(onNum)S.mult=Math.min(NUMS[ui.cur]===25?2:3,S.mult+1);break;
    case 'ok':
      if(onNum)return hit(NUMS[ui.cur]),true;
      if(ui.cur===7)return hit(0),true;
      if(ui.cur===8)return undo(),true;
      if(ui.cur===9)return nextPlayer(),true;
      ui.menu={i:0};break;
    case 'play':return hit(0),true;
    case 'rewind':return undo(),true;
    case 'ff':return nextPlayer(),true;
    case 'menu':case 'back':ui.menu={i:0};break;
    default:return false;
  }
  if(NUMS[ui.cur]===25&&S.mult===3)S.mult=2;
  persist();render();return true;
}
const MENU=()=>S?['Resume','Restart game','Change players']:['Close'];
function keyMenu(k){
  const items=MENU();
  if(k==='up')ui.menu.i=Math.max(0,ui.menu.i-1),ui.menu.confirm=false;
  else if(k==='down')ui.menu.i=Math.min(items.length-1,ui.menu.i+1),ui.menu.confirm=false;
  else if(k==='back'||k==='menu')ui.menu=null;
  else if(k==='ok'){
    const it=items[ui.menu.i];
    if(it==='Restart game'){if(!ui.menu.confirm){ui.menu.confirm=true;}else{ui.menu=null;return newGame(S.starter),true;}}
    else if(it==='Change players'){ui.menu=null;S=null;ui.srow=3;persist();}
    else ui.menu=null;
  } else return true;
  render();return true;
}
function keyWin(k){
  const n=3;
  if(k==='up'||k==='left')ui.win=Math.max(0,ui.win-1);
  else if(k==='down'||k==='right')ui.win=Math.min(n-1,ui.win+1);
  else if(k==='rewind')return undo(),true;
  else if(k==='ok'){
    if(ui.win===0)return newGame((S.starter+1)%N()),true;
    if(ui.win===1)return undo(),true;
    S=null;ui.srow=3;persist();
  } else if(k==='menu'||k==='back'){ui.menu={i:0};}
  render();return true;
}
function keySetup(k){
  ui.scol=Math.min(ui.scol,count-1);
  switch(k){
    case 'up':ui.srow=Math.max(0,ui.srow-1);break;
    case 'down':ui.srow=Math.min(3,ui.srow+1);break;
    case 'left':if(ui.srow===0)count=Math.max(1,count-1);else if(ui.srow<3)ui.scol=Math.max(0,ui.scol-1);break;
    case 'right':if(ui.srow===0)count=Math.min(4,count+1);else if(ui.srow<3)ui.scol=Math.min(count-1,ui.scol+1);break;
    case 'ok':
      if(ui.srow===1){ui.pick={p:ui.scol,i:Math.max(0,FLAGS.findIndex(f=>f[0]===setup[ui.scol].flag))};}
      else if(ui.srow===2){const v=prompt('Name for player '+(ui.scol+1),setup[ui.scol].name);if(v!==null&&v.trim())setup[ui.scol].name=v.trim().slice(0,20);}
      else if(ui.srow===3)return newGame(0),true;
      break;
    case 'back':return false;
    default:return true;
  }
  ui.scol=Math.min(ui.scol,count-1);persist();render();return true;
}
function keyPick(k){
  const cols=9,n=FLAGS.length,p=ui.pick;
  if(k==='left')p.i=Math.max(0,p.i-1);
  else if(k==='right')p.i=Math.min(n-1,p.i+1);
  else if(k==='up')p.i=p.i-cols>=0?p.i-cols:p.i;
  else if(k==='down')p.i=Math.min(n-1,p.i+cols);
  else if(k==='ok'){setup[p.p].flag=FLAGS[p.i][0];ui.pick=null;persist();}
  else if(k==='back'||k==='menu')ui.pick=null;
  render();return true;
}

/* keyboard / remote input (browser + Fire TV WebView) */
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',' ':'ok',Select:'ok',
  Escape:'back',GoBack:'back',BrowserBack:'back',Backspace:'back',MediaRewind:'rewind',MediaFastForward:'ff',
  MediaPlayPause:'play',MediaPlay:'play',ContextMenu:'menu',u:'rewind',n:'ff',m:'play'};
const CODES={13:'ok',23:'ok',37:'left',38:'up',39:'right',40:'down',4:'back',27:'back',8:'back',
  89:'rewind',227:'rewind',412:'rewind',90:'ff',228:'ff',417:'ff',85:'play',179:'play',415:'play',19:'play',82:'menu',93:'menu'};
document.addEventListener('keydown',e=>{
  const k=KEYS[e.key]||CODES[e.keyCode];
  if(!k)return;
  e.preventDefault();
  if(e.repeat&&k==='ok')return;
  handle(k);
});
window.tvKey=k=>handle(k)!==false;   // called by the Fire TV app for Back and media keys

/* ---- drawing ---- */
function markSvg(n){
  if(!n)return '';
  const a='<line x1="10" y1="30" x2="30" y2="10"/>',b='<line x1="10" y1="10" x2="30" y2="30"/>',c='<circle cx="20" cy="20" r="16"/>';
  return '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">'+(n>=1?a:'')+(n>=2?b:'')+(n>=3?c:'')+'</svg>';
}
function renderSetup(){
  ui.scol=Math.min(ui.scol,count-1);
  app.innerHTML=`<div class="setup">
    <h1 class="slab">Cricket</h1>
    <p class="sub">Pick each player’s flag to match the flights on their darts.</p>
    <div class="count${ui.srow===0?' sel':''}"><span>Players</span><span class="ar">◀</span><b class="slab">${count}</b><span class="ar">▶</span></div>
    <div class="cards">${setup.slice(0,count).map((p,i)=>`<div class="card" style="--pc:var(--p${i})">
      <div class="fbox${ui.srow===1&&ui.scol===i?' sel':''}">${flag(p.flag)}<div>${fname(p.flag)}</div></div>
      <div class="name${ui.srow===2&&ui.scol===i?' sel':''}">${esc(p.name)}<small>Press OK to rename</small></div></div>`).join('')}</div>
    <div class="start${ui.srow===3?' sel':''}">${count===1?'Start practice':'Start game'}</div>
    <div class="hint">Use the arrows to move and OK to choose. On a flag, press OK to change it.</div>
  </div>`+(ui.pick?`<div class="ov"><div class="box"><h2 class="slab" style="font-size:1.5rem">Choose a flag for ${esc(setup[ui.pick.p].name)}</h2>
    <div class="grid">${FLAGS.map((f,i)=>`<div class="gi${ui.pick.i===i?' cur':''}">${flag(f[0])}${f[1]}</div>`).join('')}</div></div></div>`:'')+menuHtml();
}
function menuHtml(){
  if(!ui.menu)return '';
  return `<div class="ov"><div class="box"><h2 class="slab">Menu</h2>${MENU().map((t,i)=>`<div class="opt${ui.menu.i===i?' cur':''}">${t==='Restart game'&&ui.menu.confirm?'Press OK again to restart':t}</div>`).join('')}</div></div>`;
}
function renderGame(){
  const P=S.players,n=P.length,cur=P[S.turn],pc=S.winner!==null?S.winner:S.turn;
  const head=`<div class="row head"><div></div>${P.map((p,i)=>`<div class="ph${S.turn===i?' on':''}"><div class="nm">${flag(p.flag)}${esc(p.name)}</div><div class="sc slab c${i}">${p.score}</div><div class="mpr">${mpr(i)} MPR</div></div>`).join('')}</div>`;
  const rows=NUMS.map((num,r)=>{
    const dead=n>1&&P.every(p=>p.marks[num]>=3);
    return `<div class="row${dead?' dead':''}${ui.cur===r&&S.winner===null?' cur':''}"><div class="num slab">${num===25?'Bull':num}</div>${P.map((p,i)=>`<div class="cell col c${i}${S.turn===i?' on':''}">${markSvg(p.marks[num])}</div>`).join('')}</div>`;}).join('');
  const bull=NUMS[ui.cur]===25;
  const slots=[0,1,2].map(k=>`<div class="slot${S.darts[k]?' f':''}">${S.darts[k]||'–'}</div>`).join('');
  const last=S.last&&n>1?`Last: ${esc(P[S.last.who].name)} threw ${S.last.darts.join(', ')||'nothing'}`:'';
  const W=S.winner!==null?P[S.winner]:null;
  const winText=!W?'':n===1?`Closed out in ${S.round} round${S.round>1?'s':''}, ${mpr(0)} marks per round`:
    `${P.map(p=>esc(p.name)+' '+p.score).join(', ')}. ${S.round} round${S.round>1?'s':''}, ${mpr(S.winner)} marks per round`;
  app.innerHTML=`<div class="game" style="--n:${n};--pc:var(--p${pc})">
    <div class="board">${head}${rows}</div>
    <div class="side">
      <div class="who"><div class="n">${flag(cur.flag)}${esc(cur.name)}</div><div class="r">${n>1?'To throw, ':''}round ${S.round}</div></div>
      <div class="slots">${slots}</div>
      <div class="mult">${['Single','Double','Triple'].map((t,k)=>`<div class="${S.mult===k+1?'on':''}${bull&&k===2?' off':''}">${t}</div>`).join('')}</div>
      <div class="acts">${ACTS.map((a,i)=>`<div class="act${ui.cur===7+i?' cur':''}"><span>${a[0]}</span><span class="k">${a[1]}</span></div>`).join('')}</div>
      <div class="last">${last}</div>
      <div class="help">▲▼ pick a number, ◀▶ single, double or triple, OK to score.<br>⏪ undo, ⏩ next player, ⏯ miss.</div>
    </div></div>`+
    (W?`<div class="ov"><div class="box" style="--pc:var(--p${S.winner})"><div class="bigf">${flag(W.flag)}</div>
      <h2 class="slab">${n===1?'All closed':esc(W.name)+' wins'}</h2><p>${winText}</p>
      ${[n===1?'Go again':'Rematch','Undo last dart','Change players'].map((t,i)=>`<div class="opt${ui.win===i?' cur':''}">${t}</div>`).join('')}</div></div>`:'')+menuHtml();
}
function render(){S?renderGame():renderSetup();}
render();
})();
</script>
</body>
</html>
